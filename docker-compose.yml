version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: anime_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - anime-net

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_NAME: anime_db
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - anime-net

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - anime-net

volumes:
  pgdata:

networks:
  anime-net:
    driver: bridge
